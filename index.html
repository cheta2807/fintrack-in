<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack.in — Personal Finance Engine</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid } = window.Recharts;

        const INITIAL_TRANSACTIONS = [
            { id: 1, date: '2026-10-01', description: 'Tech Salary', category: 'Salary', type: 'Income', amount: 155000 },
            { id: 2, date: '2026-10-02', description: 'House Rent', category: 'Housing', type: 'Expense', amount: 35000 },
            { id: 3, date: '2026-10-03', description: 'Blinkit Groceries', category: 'Groceries', type: 'Expense', amount: 7200 },
            { id: 4, date: '2026-10-12', description: 'Zerodha Index SIP', category: 'Investments', type: 'Expense', amount: 30000 }
        ];

        const formatINR = (val) => '₹' + Number(val || 0).toLocaleString('en-IN');

        function App() {
            const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);

            const totals = useMemo(() => {
                let inc = 0, exp = 0;
                transactions.forEach(t => t.type === 'Income' ? inc += t.amount : exp += t.amount);
                return { inc, exp, net: inc - exp };
            }, [transactions]);

            return (
                <div className="min-h-screen p-6 max-w-6xl mx-auto space-y-6">
                    <header className="flex justify-between items-center border-b border-slate-800 pb-4">
                        <h1 className="text-2xl font-bold text-white">FinTrack<span className="text-emerald-400">.in</span></h1>
                        <span className="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300">₹ INR Portfolio</span>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-400">NET BALANCE</div>
                            <div className="text-2xl font-bold text-white mt-1">{formatINR(totals.net)}</div>
                        </div>
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-400">INFLOW</div>
                            <div className="text-2xl font-bold text-emerald-400 mt-1">{formatINR(totals.inc)}</div>
                        </div>
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-400">OUTFLOW</div>
                            <div className="text-2xl font-bold text-rose-400 mt-1">{formatINR(totals.exp)}</div>
                        </div>
                    </div>

                    <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
                        <h2 className="text-lg font-bold text-white">Recent Ledger Entries</h2>
                        <div className="divide-y divide-slate-800 text-sm">
                            {transactions.map(t => (
                                <div key={t.id} className="py-3 flex justify-between items-center">
                                    <div>
                                        <div className="font-semibold text-white">{t.description}</div>
                                        <div className="text-xs text-slate-400">{t.date} • {t.category}</div>
                                    </div>
                                    <div className={t.type === 'Income' ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>
                                        {t.type === 'Income' ? '+' : '-'}{formatINR(t.amount)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
